services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kakeibo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
      POSTGRES_DB: ${POSTGRES_DB:-kakeibo}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kakeibo} -d ${POSTGRES_DB:-kakeibo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-kakeibo};Username=${POSTGRES_USER:-kakeibo};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}"
      # 空のときはテスト用プレースホルダで起動する（実Cognitoではログイン不可）
      Cognito__Region: ${COGNITO_REGION:-us-east-1}
      Cognito__UserPoolId: ${COGNITO_USER_POOL_ID:-us-east-1_localtestpool}
      Cognito__AppClientId: ${COGNITO_APP_CLIENT_ID:-localtestclient}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/src

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # ブラウザに渡るCognito設定。実Cognitoで確認するときは .env に実値を設定する
      VITE_COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      VITE_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-us-east-1_localtestpool}
      VITE_COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-localtestclient}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  db-data:
  frontend-node-modules:

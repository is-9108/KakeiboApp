name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' }}
      api: ${{ github.event_name == 'push' || steps.filter.outputs.api == 'true' || steps.filter.outputs.shared == 'true' }}
      infra: ${{ github.event_name == 'push' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4

      - name: 変更されたパスを判定する
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            frontend:
              - 'frontend/**'
              - '!**/*.md'
            api:
              - 'api/**'
              - '!**/*.md'
            infra:
              - 'infra/**'
              - '!**/*.md'
            shared:
              - '**'
              - '!frontend/**'
              - '!api/**'
              - '!infra/**'
              - '!docs/**'
              - '!**/*.md'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4

      - name: 環境変数（.env）を用意する
        run: |
          printf 'POSTGRES_USER=kakeibo\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=kakeibo\n' "$(openssl rand -hex 16)" > .env

      - name: フロントエンドのコンテナイメージをビルドする
        run: docker compose build frontend

      - name: フロントエンドの lint を実行する
        run: docker compose run --rm --no-deps frontend sh -c "npm ci && npm run lint"

      - name: フロントエンドのテストを実行する
        run: docker compose run --rm --no-deps frontend npm test

      - name: フロントエンドのビルド確認
        run: docker compose run --rm --no-deps frontend npm run build

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4

      - name: 環境変数（.env）を用意する
        run: |
          printf 'POSTGRES_USER=kakeibo\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=kakeibo\n' "$(openssl rand -hex 16)" > .env

      - name: API のコンテナイメージをビルドする
        run: docker compose build api

      - name: API の lint を実行する
        run: docker compose run --rm --no-deps api dotnet format Kakeibo.slnx --verify-no-changes

      - name: APIのテストを実行する
        run: docker compose run --rm api dotnet test Kakeibo.slnx

      - name: 疎通確認（smoke test）
        run: |
          docker compose up -d api
          code="000"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          echo "/health -> HTTP $code"
          docker compose ps
          if [ "$code" != "200" ]; then
            docker compose logs api db
            exit 1
          fi
          curl -s http://localhost:8080/health
          echo

  # AWS の認証情報や実リソースを使わず、デプロイ用の成果物と Terraform 定義を検証する。
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップする
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Node.js をセットアップする
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Terraform をセットアップする
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false

      - name: Lambda パッケージを作成する
        run: ./infra/scripts/package-api.sh

      - name: マイグレーション SQL を生成する
        run: ./infra/scripts/generate-migration-sql.sh

      - name: SPA フォールバックのテストを実行する
        run: node --test 'infra/tests/**/*.test.mjs'

      - name: Terraform のフォーマットを確認する
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform を初期化する（backend なし・AWS 認証情報なし）
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Terraform の構成を検証する
        run: terraform -chdir=infra validate

      - name: Terraform の構成テスト（mock provider / plan）を実行する
        run: terraform -chdir=infra test

      - name: 本番形式の設定例でフロントエンドをビルドする
        working-directory: frontend
        run: |
          cp .env.production.example .env.production.local
          npm ci
          npm run build
          rm -f .env.production.local

  ci-result:
    name: CI 結果
    needs: [changes, frontend, api, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 各ジョブの結果を確認する
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          API_RESULT: ${{ needs.api.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
        run: |
          echo "changes: $CHANGES_RESULT"
          echo "frontend: $FRONTEND_RESULT"
          echo "api: $API_RESULT"
          echo "infra: $INFRA_RESULT"
          for result in "$CHANGES_RESULT" "$FRONTEND_RESULT" "$API_RESULT" "$INFRA_RESULT"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done
